plugins { id 'com.android.application' }
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
android {
    namespace 'com.k1nosraty.readmeviewer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.k1nosraty.readmeviewer.preview'
        minSdk 26
        targetSdk 34
        versionCode 10002
        versionName appVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.register('copyWebAssets', Copy) {
    from '../..'
    include 'index.html', 'app.js', 'styles.css', 'src/**', 'vendor/**'
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
